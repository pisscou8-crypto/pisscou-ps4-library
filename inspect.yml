name: Inspect Piglet

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-22.04

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld make curl

      - name: Download OpenOrbis
        run: |
          curl -fL \
            https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz \
            -o toolchain.tar.gz
          tar -xzf toolchain.tar.gz

      - name: Find Toolchain
        run: |
          TOOL=$(find "$GITHUB_WORKSPACE" -type f -name PkgTool.Core | head -n 1)

          if [ -z "$TOOL" ]; then
            echo "ERROR: PkgTool.Core not found"
            exit 1
          fi

          TOOLCHAIN=$(dirname "$(dirname "$(dirname "$TOOL")")")
          echo "OO_PS4_TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"

      - name: Find Piglet
        run: |
          SAMPLE=""

          for DIR in \
            "$OO_PS4_TOOLCHAIN"/samples/* \
            "$OO_PS4_TOOLCHAIN"/samples/*/*; do

            if [ -f "$DIR/Makefile" ] && \
               grep -qiE "piglet|opengl|egl|gles" "$DIR/Makefile"; then
              SAMPLE="$DIR"
              break
            fi
          done

          if [ -z "$SAMPLE" ]; then
            echo "Piglet not found"
            exit 1
          fi

          echo "GRAPHICS_SAMPLE=$SAMPLE" >> "$GITHUB_ENV"

      - name: Show source files
        run: |
          echo "===== SOURCE FILES ====="
          find "$GRAPHICS_SAMPLE" -type f \
            \( -name "*.cpp" -o -name "*.hpp" -o -name "*.h" \) | sort
