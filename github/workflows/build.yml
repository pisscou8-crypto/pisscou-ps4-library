name: Build Pisscou Store

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld make curl python3 python3-pil

      - name: Download OpenOrbis v0.5.4
        run: |
          curl -fL \
            https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz \
            -o toolchain.tar.gz

          tar -xzf toolchain.tar.gz

      - name: Find OpenOrbis Toolchain
        run: |
          TOOL=$(find "$GITHUB_WORKSPACE" -type f -name PkgTool.Core | head -n 1)

          if [ -z "$TOOL" ]; then
            echo "ERROR: PkgTool.Core not found"
            exit 1
          fi

          TOOLCHAIN=$(dirname "$(dirname "$(dirname "$TOOL")")")

          echo "OO_PS4_TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"

          chmod +x "$TOOLCHAIN"/bin/linux/* || true

      - name: Find Piglet Sample
        run: |
          PIGLET="$OO_PS4_TOOLCHAIN/samples/piglet"

          if [ ! -f "$PIGLET/Makefile" ]; then
            echo "ERROR: Piglet sample not found"
            exit 1
          fi

          echo "PIGLET=$PIGLET" >> "$GITHUB_ENV"

      - name: Build Piglet
        working-directory: ${{ env.PIGLET }}
        run: |
          make clean || true
          make

      - name: Find PKG
        run: |
          PKG=$(find "$PIGLET" -type f -name "*.pkg" | head -n 1)

          if [ -z "$PKG" ]; then
            echo "ERROR: No PKG was created"
            exit 1
          fi

          echo "PKG=$PKG" >> "$GITHUB_ENV"

      - name: Upload Pisscou Store
        uses: actions/upload-artifact@v4
        with:
          name: pisscou-store
          path: ${{ env.PKG }}
