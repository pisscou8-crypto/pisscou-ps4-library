name: Build PS4 PKG

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Download OpenOrbis sample packages
        run: |
          curl -L \
            https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/samples-pkg-llvm-18.zip \
            -o samples.zip

          unzip -q samples.zip -d samples

      - name: List sample packages
        run: |
          echo "Available PKG files:"
          find samples -type f -name "*.pkg" -print

      - name: Upload sample PKG
        uses: actions/upload-artifact@v4
        with:
          name: openorbis-sample-pkgs
          path: samples/**/*.pkg
