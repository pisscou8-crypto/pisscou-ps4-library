name: Build PS4 PKG

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout OpenOrbis
        uses: actions/checkout@v4
        with:
          repository: OpenOrbis/OpenOrbis-PS4-Toolchain
          ref: v0.5.4
          path: openorbis

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld make curl

      - name: Download OpenOrbis Toolchain
        run: |
          curl -L \
            https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz \
            -o toolchain.tar.gz

          tar -xzf toolchain.tar.gz

      - name: Locate Toolchain
        run: |
          TOOL=$(find "$GITHUB_WORKSPACE" -type f -name PkgTool.Core | head -n 1)

          if [ -z "$TOOL" ]; then
            echo "PkgTool.Core not found"
            exit 1
          fi

          TOOLCHAIN=$(dirname "$(dirname "$(dirname "$TOOL")")")

          echo "OO_PS4_TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"

          chmod +x "$TOOLCHAIN"/bin/linux/* || true

          echo "Toolchain: $TOOLCHAIN"

      - name: Prepare PS4 package files
        run: |
          APP="$GITHUB_WORKSPACE/openorbis/samples/hello_world"

          mkdir -p "$APP/sce_sys/about"
          mkdir -p "$APP/sce_module"

          RIGHT=$(find "$GITHUB_WORKSPACE" -type f -name "right.sprx" | head -n 1)
          LIBC=$(find "$GITHUB_WORKSPACE" -type f -name "libc.prx" | head -n 1)
          FIOS=$(find "$GITHUB_WORKSPACE" -type f -name "libSceFios2.prx" | head -n 1)

          if [ -z "$RIGHT" ]; then
            echo "right.sprx not found"
            exit 1
          fi

          if [ -z "$LIBC" ]; then
            echo "libc.prx not found"
            exit 1
          fi

          if [ -z "$FIOS" ]; then
            echo "libSceFios2.prx not found"
            exit 1
          fi

          cp "$RIGHT" "$APP/sce_sys/about/right.sprx"
          cp "$LIBC" "$APP/sce_module/libc.prx"
          cp "$FIOS" "$APP/sce_module/libSceFios2.prx"

          echo "Package files prepared."

      - name: Build Hello World
        working-directory: openorbis/samples/hello_world
        run: |
          make clean || true
          make

      - name: Upload PS4 PKG
        uses: actions/upload-artifact@v4
        with:
          name: pisscou-ps4-test-v2
          path: openorbis/samples/hello_world/*.pkg
