name: Build PS4 Graphics PKG

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld make curl

      - name: Download OpenOrbis v0.5.4
        run: |
          curl -fL \
            https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz \
            -o toolchain.tar.gz

          tar -xzf toolchain.tar.gz

      - name: Find OpenOrbis Toolchain
        run: |
          TOOL=$(find "$GITHUB_WORKSPACE" -type f -name PkgTool.Core | head -n 1)

          if [ -z "$TOOL" ]; then
            echo "ERROR: PkgTool.Core not found"
            exit 1
          fi

          TOOLCHAIN=$(dirname "$(dirname "$(dirname "$TOOL")")")

          echo "OO_PS4_TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"

          chmod +x "$TOOLCHAIN"/bin/linux/* || true

          echo "OpenOrbis:"
          echo "$TOOLCHAIN"

      - name: Find Graphics Sample
        run: |
          echo "Searching for Piglet/OpenGL samples..."

          SAMPLE=""

          for DIR in \
            "$OO_PS4_TOOLCHAIN"/samples/* \
            "$OO_PS4_TOOLCHAIN"/samples/*/*; do

            if [ -f "$DIR/Makefile" ]; then
              if grep -qiE "piglet|opengl|egl|gles" "$DIR/Makefile"; then
                SAMPLE="$DIR"
                break
              fi
            fi
          done

          if [ -z "$SAMPLE" ]; then
            echo "ERROR: Graphics sample not found."
            echo "Available samples:"
            find "$OO_PS4_TOOLCHAIN/samples" -maxdepth 3 -type f -name Makefile -print
            exit 1
          fi

          echo "GRAPHICS_SAMPLE=$SAMPLE" >> "$GITHUB_ENV"

          echo "Graphics sample:"
          echo "$SAMPLE"

      - name: Show Graphics Sample
        run: |
          echo "===== GRAPHICS SAMPLE FILES ====="
          find "$GRAPHICS_SAMPLE" -maxdepth 3 -type f | sort

      - name: Check package files
        run: |
          if [ ! -f "$GRAPHICS_SAMPLE/sce_sys/about/right.sprx" ]; then
            echo "WARNING: right.sprx not found directly in sample."
          else
            echo "right.sprx found."
          fi

      - name: Build Graphics Sample
        working-directory: ${{ env.GRAPHICS_SAMPLE }}
        run: |
          make clean || true
          make

      - name: Find PKG
        run: |
          echo "===== PKG FILES ====="
          find "$GRAPHICS_SAMPLE" -type f -name "*.pkg" -print

          PKG=$(find "$GRAPHICS_SAMPLE" -type f -name "*.pkg" | head -n 1)

          if [ -z "$PKG" ]; then
            echo "ERROR: No PKG was produced."
            exit 1
          fi

          echo "PKG=$PKG" >> "$GITHUB_ENV"

      - name: Upload Graphics PKG
        uses: actions/upload-artifact@v4
        with:
          name: pisscou-graphics-test
          path: ${{ env.PKG }}
