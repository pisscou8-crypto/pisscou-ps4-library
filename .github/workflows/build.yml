name: Build PS4 PKG

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld make curl

      - name: Download OpenOrbis Release
        run: |
          curl -fL \
            https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz \
            -o toolchain.tar.gz

          tar -xzf toolchain.tar.gz

      - name: Find OpenOrbis Toolchain
        run: |
          TOOL=$(find "$GITHUB_WORKSPACE" -type f -name PkgTool.Core | head -n 1)

          if [ -z "$TOOL" ]; then
            echo "ERROR: PkgTool.Core not found"
            exit 1
          fi

          TOOLCHAIN=$(dirname "$(dirname "$(dirname "$TOOL")")")

          echo "OO_PS4_TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"

          chmod +x "$TOOLCHAIN"/bin/linux/* || true

          echo "Toolchain:"
          echo "$TOOLCHAIN"

      - name: Find Input Sample
        run: |
          INPUT=$(find "$OO_PS4_TOOLCHAIN" -type d -path "*/samples/input" | head -n 1)

          if [ -z "$INPUT" ]; then
            echo "ERROR: Input sample not found inside Release"
            find "$OO_PS4_TOOLCHAIN/samples" -maxdepth 2 -type d
            exit 1
          fi

          echo "INPUT=$INPUT" >> "$GITHUB_ENV"

          echo "Input sample:"
          echo "$INPUT"

      - name: Check required files
        run: |
          echo "Checking sample files..."

          find "$INPUT" -maxdepth 3 -type f | sort

          if [ ! -f "$INPUT/sce_sys/about/right.sprx" ]; then
            echo "ERROR: right.sprx is missing from the Release sample."
            exit 1
          fi

          echo "right.sprx found."

      - name: Build Input Sample
        working-directory: ${{ env.INPUT }}
        run: |
          make clean || true
          make

      - name: Check PKG
        run: |
          echo "PKG files:"
          find "$INPUT" -type f -name "*.pkg" -print

      - name: Upload PS4 PKG
        uses: actions/upload-artifact@v4
        with:
          name: pisscou-ps4-input-test
          path: ${{ env.INPUT }}/*.pkg
