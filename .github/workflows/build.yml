name: Build PS4 PKG

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout OpenOrbis source
        uses: actions/checkout@v4
        with:
          repository: OpenOrbis/OpenOrbis-PS4-Toolchain
          ref: v0.5.4
          path: openorbis

      - name: Download OpenOrbis toolchain
        run: |
          curl -fL \
            https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz \
            -o toolchain.tar.gz

          tar -xzf toolchain.tar.gz

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld make curl

      - name: Locate toolchain
        run: |
          TOOL=$(find "$GITHUB_WORKSPACE" -type f -name PkgTool.Core | head -n 1)

          if [ -z "$TOOL" ]; then
            echo "PkgTool.Core not found"
            exit 1
          fi

          TOOLCHAIN=$(dirname "$(dirname "$(dirname "$TOOL")")")

          echo "OO_PS4_TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"

          chmod +x "$TOOLCHAIN"/bin/linux/* || true

          echo "Toolchain: $TOOLCHAIN"

      - name: Download official right module
        run: |
          git clone --depth 1 \
            https://github.com/OpenOrbis/right.git \
            right

          mkdir -p openorbis/samples/input/sce_sys/about

          cp right/right0/sce_sys/about/right.sprx \
             openorbis/samples/input/sce_sys/about/right.sprx

      - name: Copy required modules
        run: |
          mkdir -p openorbis/samples/input/sce_module

          cp "$OO_PS4_TOOLCHAIN/bin/data/modules/libc.prx" \
             openorbis/samples/input/sce_module/libc.prx

          cp "$OO_PS4_TOOLCHAIN/bin/data/modules/libSceFios2.prx" \
             openorbis/samples/input/sce_module/libSceFios2.prx

      - name: Build OpenOrbis Input Sample
        working-directory: openorbis/samples/input
        run: |
          make clean || true
          make

      - name: Check generated PKG
        run: |
          find openorbis/samples/input -type f -name "*.pkg" -print

      - name: Upload PS4 PKG
        uses: actions/upload-artifact@v4
        with:
          name: pisscou-ps4-input-test
          path: openorbis/samples/input/*.pkg
