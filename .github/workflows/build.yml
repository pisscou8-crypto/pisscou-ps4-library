name: Build Pisscou Store

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld make curl python3 python3-pil

      - name: Download OpenOrbis v0.5.4
        run: |
          curl -fL \
            https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz \
            -o toolchain.tar.gz

          tar -xzf toolchain.tar.gz

      - name: Find OpenOrbis Toolchain
        run: |
          TOOL=$(find "$GITHUB_WORKSPACE" -type f -name PkgTool.Core | head -n 1)

          if [ -z "$TOOL" ]; then
            echo "ERROR: PkgTool.Core not found"
            exit 1
          fi

          TOOLCHAIN=$(dirname "$(dirname "$(dirname "$TOOL")")")

          echo "OO_PS4_TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"

          chmod +x "$TOOLCHAIN"/bin/linux/* || true

          echo "Toolchain:"
          echo "$TOOLCHAIN"

      - name: Find Piglet Sample
        run: |
          PIGLET="$OO_PS4_TOOLCHAIN/samples/piglet"

          if [ ! -f "$PIGLET/Makefile" ]; then
            echo "ERROR: Piglet sample not found"
            exit 1
          fi

          echo "PIGLET=$PIGLET" >> "$GITHUB_ENV"

          echo "Piglet sample:"
          echo "$PIGLET"

      - name: Create Pisscou Store Artwork
        run: |
          python3 <<'PY'
          from PIL import Image, ImageDraw, ImageFont

          W, H = 1920, 1080

          img = Image.new("RGB", (W, H), (18, 20, 28))
          d = ImageDraw.Draw(img)

          font_big = ImageFont.truetype(
              "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", 72
          )

          font_title = ImageFont.truetype(
              "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", 44
          )

          font_small = ImageFont.truetype(
              "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf", 28
          )

          font_button = ImageFont.truetype(
              "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", 30
          )

          # Background
          d.rectangle((0, 0, W, H), fill=(18, 20, 28))

          # Header
          d.rectangle((0, 0, W, 150), fill=(27, 31, 43))

          d.text(
              (70, 35),
              "PISSCOU STORE",
              font=font_big,
              fill=(245, 245, 250)
          )

          d.text(
              (70, 112),
              "PS4 HOME BREW GAME STORE",
              font=font_small,
              fill=(150, 160, 180)
          )

          # Game cards
          games = [
              ("GOD OF WAR", (54, 58, 82)),
              ("SEKIRO", (73, 51, 43)),
              ("LIES OF P", (48, 63, 78)),
              ("ELDEN RING", (78, 67, 42))
          ]

          start_x = 70
          y = 220
          card_w = 420
          card_h = 500
          gap = 35

          for i, (name, bg) in enumerate(games):
              x = start_x + i * (card_w + gap)

              d.rounded_rectangle(
                  (x, y, x + card_w, y + card_h),
                  radius=25,
                  fill=bg
              )

              # top accent
              d.rectangle(
                  (x, y, x + card_w, y + 12),
                  fill=(225, 190, 80)
              )

              d.text(
                  (x + 30, y + 330),
                  name,
                  font=font_title,
                  fill=(255, 255, 255)
              )

              d.text(
                  (x + 30, y + 395),
                  "PKG DOWNLOAD",
                  font=font_small,
                  fill=(190, 200, 215)
              )

          # Bottom information bar
          d.rounded_rectangle(
              (70, 790, 1850, 970),
              radius=25,
              fill=(27, 31, 43)
          )

          d.text(
              (110, 825),
              "D-PAD",
              font=font_button,
              fill=(235, 235, 240)
          )

          d.text(
              (300, 825),
              "SELECT GAME",
              font=font_small,
              fill=(160, 170, 190)
          )

          d.text(
              (700, 825),
              "X",
              font=font_button,
              fill=(235, 235, 240)
          )

          d.text(
              (760, 825),
              "DOWNLOAD",
              font=font_small,
              fill=(160, 170, 190)
          )

          d.text(
              (1170, 825),
              "O",
              font=font_button,
              fill=(235, 235, 240)
          )

          d.text(
              (1230, 825),
              "BACK",
              font=font_small,
              fill=(160, 170, 190)
          )

          d.text(
              (110, 900),
              "Authorized / owned PKG files only",
              font=font_small,
              fill=(120, 130, 150)
          )

          # Footer
          d.text(
              (70, 1015),
              "PISSCOU GAME STORE",
              font=font_small,
              fill=(110, 120, 140)
          )

          img.save(
              "rgba_texture.png",
              "PNG"
          )
          PY

          cp rgba_texture.png \
            "$PIGLET/assets/images/rgba_texture.png"

      - name: Patch Piglet Into Pisscou Store
        run: |
          python3 <<'PY'
          from pathlib import Path

          cpp = Path(
              "OpenOrbis/PS4Toolchain/samples/piglet/piglet/PigletApplication.cpp"
          )

          text = cpp.read_text()

          start = text.index(
              "    void PigletApplication::doFrame() {"
          )

          end = text.index(
              "    bool PigletApplication::Init() {",
              start
          )

          replacement = r'''    void PigletApplication::doFrame() {
          drawTexture(
              s_texture_id,
              0.0f,
              0.0f,
              1920.0f,
              1080.0f,
              0.0f,
              1.0f
          );
      }

'''

          text = text[:start] + replacement + text[end:]

          cpp.write_text(text)
          PY

      - name: Patch Package Metadata
        run: |
          python3 <<'PY'
          from pathlib import Path

          makefile = Path(
              "OpenOrbis/PS4Toolchain/samples/piglet/Makefile"
          )

          text = makefile.read_text()

          text = text.replace(
              "TITLE       := OpenOrbis Piglet Sample",
              "TITLE       := Pisscou Store"
          )

          text = text.replace(
              "CONTENT_ID  := IV0000-BREW00093_00-PIGLETGPUR000000",
              "CONTENT_ID  := IV0000-PISSCOUSTORE0001"
          )

          makefile.write_text(text)
          PY

      - name: Build Pisscou Store
        working-directory: ${{ env.PIGLET }}
        run: |
          make clean || true
          make

      - name: Find PKG
        run: |
          PKG=$(find "$PIGLET" -type f -name "*.pkg" | head -n 1)

          if [ -z "$PKG" ]; then
            echo "ERROR: PKG was not created"
            exit 1
          fi

          echo "PKG=$PKG" >> "$GITHUB_ENV"

          echo "Created:"
          echo "$PKG"

      - name: Upload Pisscou Store
        uses: actions/upload-artifact@v4
        with:
          name: pisscou-store
          path: ${{ env.PKG }}
