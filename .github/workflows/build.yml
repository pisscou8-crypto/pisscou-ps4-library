name: Build PISSCOU APP LIBRARY

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld make curl binutils

      - name: Download OpenOrbis v0.5.4
        run: |
          curl -fL \
            https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz \
            -o toolchain.tar.gz

          tar -xzf toolchain.tar.gz

      - name: Find OpenOrbis
        run: |
          TOOL=$(find "$GITHUB_WORKSPACE" \
            -type f \
            -name PkgTool.Core \
            | head -n 1)

          if [ -z "$TOOL" ]; then
            echo "ERROR: OpenOrbis PkgTool.Core not found"
            exit 1
          fi

          TOOLCHAIN=$(dirname "$(dirname "$(dirname "$TOOL")")")

          echo "OO_PS4_TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"

          chmod +x "$TOOLCHAIN"/bin/linux/* || true

          echo "Toolchain:"
          echo "$TOOLCHAIN"

      - name: Check Library Source
        run: |
          echo "===== LIBRARY SOURCE ====="
          find samples/library -maxdepth 3 -type f | sort

          echo
          echo "===== MAIN.CPP ====="
          cat samples/library/main.cpp

      - name: Build Library
        working-directory: samples/library
        run: |
          make clean || true
          make

      - name: Verify Library Build
        working-directory: samples/library
        run: |
          echo "===== BUILD OUTPUT ====="
          find . -type f | sort

          if [ ! -f eboot.bin ]; then
            echo "ERROR: eboot.bin was not created"
            exit 1
          fi

          echo
          echo "===== EBOOT STRINGS ====="

          strings eboot.bin | grep -Ei \
            "PISSCOU|APP LIBRARY|FPKGi|GAME STORE|My Game" \
            || true

      - name: Find PKG
        run: |
          echo "===== PKG FILES ====="

          find samples/library \
            -type f \
            -name "*.pkg" \
            -print

          PKG=$(find samples/library \
            -type f \
            -name "*.pkg" \
            | head -n 1)

          if [ -z "$PKG" ]; then
            echo "ERROR: NO PKG WAS CREATED"
            exit 1
          fi

          echo "================================="
          echo "FINAL PKG:"
          echo "$PKG"
          echo "================================="

          echo "PKG=$PKG" >> "$GITHUB_ENV"

      - name: Upload PISSCOU APP LIBRARY
        uses: actions/upload-artifact@v4
        with:
          name: PISSCOU-APP-LIBRARY
          path: ${{ env.PKG }}
